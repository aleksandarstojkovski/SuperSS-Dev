name: Build Server Components

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    name: Linux build (make / g++)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libzip-dev \
            default-libmysqlclient-dev \
            unixodbc-dev \
            libssl-dev

      - name: Build all components
        working-directory: "Server Lib/Linux Builds"
        run: |
          set -euo pipefail
          # Build order matters: the GGSrvLib26-1 static library and the
          # Smart Calculator / GG Auth 7.0 shared libraries must exist
          # before the Game Server, which links / consumes them.
          components=(
            "ggsrvlib:GGSrvLib26-1 static library"
            "smart:Smart Calculator shared library"
            "ggauth70:GG Auth 7.0 shared library"
            "as:Auth Server"
            "ls:Login Server"
            "ms:Message Server"
            "rs:Rank Server"
            "iff:IFF Manager"
            "gs:Game Server"
          )
          for entry in "${components[@]}"; do
            mk="${entry%%:*}"
            desc="${entry#*:}"
            echo "::group::Building ${desc} (Makefile-${mk}.mk)"
            make -f "Makefile-${mk}.mk" -j"$(nproc)"
            echo "::endgroup::"
          done

      - name: Verify built artifacts
        working-directory: "Server Lib/Linux Builds"
        run: |
          set -euo pipefail
          artifacts=(
            "Auth Server/auth"
            "Login Server/login"
            "Message Server/msn"
            "Rank Server/rank"
            "Game Server/game"
            "IFF Manager/iff"
            "Game Server/SMARTCALCULATORLIB.so"
            "Game Server/ggauth701.so"
            "GGSrvLib26-1/GGSrvLib26-1.a"
          )
          fail=0
          for a in "${artifacts[@]}"; do
            if [ ! -e "$a" ]; then
              echo "MISSING: $a"
              fail=1
              continue
            fi
            printf '%-40s ' "$a"
            file "$a"
          done
          exit "$fail"

      - name: Upload Linux server binaries
        uses: actions/upload-artifact@v4
        with:
          name: superss-server-binaries-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            Server Lib/Linux Builds/Auth Server/auth
            Server Lib/Linux Builds/Login Server/login
            Server Lib/Linux Builds/Message Server/msn
            Server Lib/Linux Builds/Rank Server/rank
            Server Lib/Linux Builds/Game Server/game
            Server Lib/Linux Builds/IFF Manager/iff
            Server Lib/Linux Builds/Game Server/SMARTCALCULATORLIB.so
            Server Lib/Linux Builds/Game Server/ggauth701.so
            Server Lib/Linux Builds/GGSrvLib26-1/GGSrvLib26-1.a

  windows-build:
    name: Windows build (MSBuild / MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-glib-x64-windows-v1

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg_cache" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}\vcpkg_cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install glib (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install glib:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg glib install failed" }

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-glib-x64-windows-v1

      - name: Install MySQL client (Connector/C)
        shell: pwsh
        run: |
          # The Windows sources hard-code this path in
          # Server Lib/Projeto IOCP/DATABASE/mysql_db.h
          $dest = "C:\Program Files\MySQL\MySQL Connector C 6.1"
          $zip = Join-Path $env:RUNNER_TEMP "mysql-c.zip"
          $out = Join-Path $env:RUNNER_TEMP "mysql-c"
          $url = "https://downloads.mysql.com/archives/get/p/19/file/mysql-connector-c-6.1.11-winx64.zip"

          # Primary: download the official Connector/C 6.1 archive (retry, since
          # the Oracle CDN occasionally serves a transient HTML error page).
          $ok = $false
          for ($i = 1; $i -le 5 -and -not $ok; $i++) {
            try {
              Write-Host "Attempt $i : downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -MaximumRedirection 10 `
                -Headers @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
              $fs = [System.IO.File]::OpenRead($zip); $b0 = $fs.ReadByte(); $b1 = $fs.ReadByte(); $fs.Close()
              if ($b0 -eq 0x50 -and $b1 -eq 0x4B) { $ok = $true }   # "PK" => real ZIP
              else { Write-Host "Downloaded file is not a ZIP (error page); retrying"; Start-Sleep -Seconds 15 }
            } catch {
              Write-Host "Download error: $($_.Exception.Message)"; Start-Sleep -Seconds 15
            }
          }

          if ($ok) {
            Expand-Archive -Path $zip -DestinationPath $out -Force
            $src = Get-ChildItem $out -Directory | Select-Object -First 1
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path (Join-Path $src.FullName '*') -Destination $dest -Recurse -Force
          } else {
            # Fallback: MariaDB Connector/C from vcpkg exposes the same libmysql
            # C API (the Linux build already links a MySQL 8-era client fine).
            Write-Host "Official archive unavailable; falling back to vcpkg libmariadb"
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libmariadb:x64-windows
            if ($LASTEXITCODE -ne 0) { throw "vcpkg libmariadb install failed" }
            $vc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
            $mysqlH = Get-ChildItem "$vc\include" -Recurse -Filter mysql.h | Select-Object -First 1
            if (-not $mysqlH) { throw "mysql.h not found in vcpkg libmariadb" }
            $srcInc = $mysqlH.Directory.FullName
            New-Item -ItemType Directory -Force -Path "$dest\include", "$dest\include\mysql", "$dest\lib" | Out-Null
            Copy-Item "$srcInc\*" "$dest\include\" -Recurse -Force
            Copy-Item "$srcInc\*" "$dest\include\mysql\" -Recurse -Force
            $libCandidate = Get-ChildItem "$vc\lib" -Recurse -Include "libmariadb.lib", "mariadbclient.lib", "libmysql.lib" | Select-Object -First 1
            if (-not $libCandidate) { throw "MariaDB import library not found" }
            Copy-Item $libCandidate.FullName "$dest\lib\libmysql.lib" -Force
            "INCLUDE=$dest\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          if (-not (Test-Path "$dest\include\mysql.h")) { throw "mysql.h not found at $dest" }
          if (-not (Test-Path "$dest\lib\libmysql.lib")) { throw "libmysql.lib not found at $dest" }
          Write-Host "MySQL client ready at $dest"

      - name: Prepare build environment
        shell: pwsh
        run: |
          # The x64 Windows sources include libzip via "../ZIP/x64/zip.h";
          # provision that layout from the headers bundled in the repo.
          $zipDir = "Server Lib/Projeto IOCP/ZIP"
          New-Item -ItemType Directory -Force -Path "$zipDir/x64" | Out-Null
          Copy-Item "$zipDir/zip.h" "$zipDir/x64/zip.h" -Force
          Copy-Item "$zipDir/zipconf.h" "$zipDir/x64/zipconf.h" -Force

          # glib: headers in include/glib-2.0, glibconfig.h in lib/glib-2.0/include.
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $lib = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib"
          "INCLUDE=$inc;$inc\glib-2.0;$lib\glib-2.0\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # reader_ini.cpp uses GLib's GKeyFile; the projects don't list glib
          # explicitly, so inject it through the linker's LINK env variable.
          "LINK=glib-2.0.lib gobject-2.0.lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # The sources set "#pragma pack(1)" which leaks into the modern Windows
          # SDK headers (they added a packing static_assert after the SDK this
          # project originally targeted). WINDOWS_IGNORE_PACKING_MISMATCH is the
          # SDK-sanctioned way to silence it. /MP builds source files in parallel.
          "CL=/MP /DWINDOWS_IGNORE_PACKING_MISMATCH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build all solutions
        shell: pwsh
        run: |
          # Build order: GGSrvLib26-1 (static lib) and the shared libs first,
          # then the servers; Game Server links GGSrvLib26-1.lib and comes last.
          # Multi Client is a test client (not a server component) and, like the
          # Linux build, is not built here.
          $solutions = @(
            "Server Lib/GGSrvLib26-1/GGSrvLib26-1.sln",
            "Server Lib/Smart Calculator lib/Smart Calculator Lib.sln",
            "Server Lib/ggauth70-1/ggauth70-1.sln",
            "Server Lib/Auth Server/Auth Server.sln",
            "Server Lib/Login Server/Login Server.sln",
            "Server Lib/Message Server/Message Server.sln",
            "Server Lib/Rank Server/Rank Server.sln",
            "Server Lib/IFF Manager/IFF Manager.sln",
            "Server Lib/GG Auth Server/GG Auth Server.sln",
            "Server Lib/Game Server/Game Server.sln"
          )
          $failed = @()
          foreach ($s in $solutions) {
            Write-Host "::group::Building $s"
            msbuild "$s" /m /nologo `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:PlatformToolset=v143 `
              /p:WindowsTargetPlatformVersion=10.0
            if ($LASTEXITCODE -ne 0) { $failed += $s }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "The following solutions failed to build:"
            $failed | ForEach-Object { Write-Host " - $_" }
            exit 1
          }
          Write-Host "All solutions built successfully."

      - name: Upload Windows server binaries
        uses: actions/upload-artifact@v4
        with:
          name: superss-server-binaries-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            Server Lib/**/x64/Release/*.exe
            Server Lib/**/x64/Release/*.dll
            Server Lib/**/x64/Release/*.lib
