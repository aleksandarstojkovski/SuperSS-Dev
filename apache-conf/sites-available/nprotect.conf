#Nprotect
<VirtualHost *:80>
	
Define DOCROOT_NPROTECT "${INSTALL_DIR}/www/nprotect"	

	ServerName ss5.ddns.net
	# GameGuard.des uses these Host headers after a hosts-file redirect.
	ServerAlias ss5.ddns.net mgr.gameguard.co.kr dl.pangya.jp
	
	TraceEnable off
	ServerSignature off
	
	ErrorLog "${INSTALL_DIR}/logs/nprotect_error.log"
	CustomLog "${INSTALL_DIR}/logs/nprotect_access.log" common
	
	DocumentRoot "${INSTALL_DIR}/www/nprotect/"

	# npgmup requests /nPro/GameGuard/RealServer/update.cfg. Without this
	# alias that path is a 404 HTML page and GameGuard reports 361 AUTH_INI.
	Alias /nPro/GameGuard "${DOCROOT_NPROTECT}/GameGuard"

	<Directory "${INSTALL_DIR}/www/nprotect/">
		
		#DirectoryIndex "index.php"
		
		# Diretorio pangya nprotect
    
		Options FollowSymLinks
		
		<FilesMatch ".*">
			require all denied
		</FilesMatch>

		<FilesMatch "\.cfg$">
			require all granted
		</FilesMatch>

		<FilesMatch "\.npz$">
			require all granted
		</FilesMatch>
		
	</Directory>

	<Directory "${DOCROOT_NPROTECT}/LogServer3/">

		Options FollowSymLinks

		# Per-directory RewriteRule matches the path relative to this
		# folder (service.do), not the full URI. The old ^.*/LogServer3/
		# pattern never matches here.
		RewriteEngine On
		RewriteBase /LogServer3/
		RewriteRule ^([^\.]+)$ $1.php [L]
		RewriteRule ^(.*)\.do$ $1.php [L]

		<FilesMatch ".*">
			require all denied
		</FilesMatch>
		
		<FilesMatch "\.php$">
			require all granted
		</FilesMatch>

		<FilesMatch "\.do$">
			require all granted
		</FilesMatch>

		<FilesMatch "bn">
			require all granted
		</FilesMatch>
		
		<FilesMatch "bl">
			require all granted
		</FilesMatch>

		<FilesMatch "mr">
			require all granted
		</FilesMatch>
	</Directory>

	<Directory "${DOCROOT_NPROTECT}/LogServer3/log/">
		require all denied
	</Directory>

	<Directory "${DOCROOT_NPROTECT}/LogServer3/config/">
		require all denied
	</Directory>

  ErrorDocument 400 "Unknown error"
  ErrorDocument 404 "Unknown error"
  ErrorDocument 403 "Unknown error"
  ErrorDocument 500 "Unknown error"

</VirtualHost>
